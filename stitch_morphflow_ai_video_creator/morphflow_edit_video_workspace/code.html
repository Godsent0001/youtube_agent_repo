<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            opacity: 1;
        }

            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

<body class="bg-background text-on-surface min-h-screen flex font-body-md overflow-x-hidden">
<!-- SideNavBar (Shared Component) -->
<aside class="w-[280px] border-r border-outline-variant/30 flex-shrink-0 flex flex-col h-screen sticky top-0 bg-surface-container-lowest hidden md:flex">
<div class="p-8">
<span class="font-headline-md text-headline-md font-black text-primary tracking-tighter">MorphFlow</span>
</div>
<nav class="flex-grow px-4 space-y-1">
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container rounded-xl transition-colors" href="#">
<span class="material-symbols-outlined">grid_view</span>
<span class="font-label-md">Explore</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 bg-secondary-container text-primary rounded-xl font-medium" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">movie</span>
<span class="font-label-md">Creations</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container rounded-xl transition-colors" href="#">
<span class="material-symbols-outlined">auto_awesome</span>
<span class="font-label-md">Generate</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container rounded-xl transition-colors" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md">Settings</span>
</a>
</nav>
<div class="p-4 border-t border-outline-variant/20">
<div class="flex items-center gap-3 px-4 py-3">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-xs font-bold">JD</div>
<div class="flex-grow">
<p class="font-label-md text-primary leading-none">John Doe</p>
<p class="text-[10px] text-on-surface-variant">Pro Plan</p>
</div>
</div>
</div>
</aside>
<main class="flex-grow flex flex-col min-h-screen relative">
<div class="flex-grow pt-12 pb-32 px-container-padding-mobile md:px-container-padding-desktop max-w-[1200px] mx-auto w-full">
<!-- Header Section -->
<header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6">
<div class="space-y-1">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Cyberpunk Metropolis Dawn</h1>
<p class="text-on-surface-variant font-body-md">Generated 2 minutes ago</p>
</div>
<!-- Quick Actions -->
<div class="flex items-center gap-3 w-full md:w-auto">
<button class="flex-1 md:flex-none flex items-center justify-center gap-2 px-6 py-3 border border-outline-variant hover:bg-surface-container transition-colors rounded-xl font-label-md text-label-md active:scale-95">
<span class="material-symbols-outlined text-[20px]">share</span>Share
                    </button>
<button class="flex-1 md:flex-none flex items-center justify-center gap-2 px-6 py-3 bg-primary text-on-primary hover:opacity-90 transition-opacity rounded-xl font-label-md text-label-md active:scale-95">
<span class="material-symbols-outlined text-[20px]">download</span>Download
                    </button>
</div>
</header>
<!-- Video Player Area -->
<div class="w-full">
<!-- Video Container -->
<div class="relative group video-container bg-surface-container-lowest rounded-[32px] overflow-hidden border border-outline-variant/30 shadow-[0_32px_64px_rgba(0,0,0,0.12)] aspect-video cursor-pointer">
<img alt="Video Poster" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQbhcUzDvJuacfp83BU7U9amOXJ3XRh9nLL3VPatyiVU9vPTX3AGrZ7gkGaIJEUnObAn4a0KXmxyIY8Ny1n_5GWLCf8n5ySCb7Ch16Xy-2A8N7glbTZhr802Ls6AYOhx577Tx2TbWBlz8VQmcAUHkukYUidvE2aHOOw9mCGgJraKnYu5wCXFUtsXqDyLRZ4GXjybUcsp-WQalarWhHqFxPvePfDMQCEti5IpzlXx9NaWkJXiRtC15dtz7Fv7OOyWdXiYCGwOi7YcQ"/>
<!-- Overlay Play State -->
<div class="absolute inset-0 bg-black/20 flex items-center justify-center transition-colors group-hover:bg-black/10">
<div class="w-24 h-24 rounded-full bg-white/20 backdrop-blur-xl flex items-center justify-center border border-white/30 active:scale-90 transition-all shadow-2xl">
<span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
</div>
<!-- Video Controls Overlay -->
<div class="absolute bottom-0 left-0 right-0 p-8 bg-gradient-to-t from-black/80 via-black/40 to-transparent video-controls opacity-0 transition-opacity duration-300">
<div class="flex items-center gap-6 text-white">
<span class="material-symbols-outlined cursor-pointer hover:scale-110 transition-transform">play_arrow</span>
<div class="flex-grow h-1.5 bg-white/20 rounded-full overflow-hidden relative">
<div class="absolute top-0 left-0 h-full w-1/3 bg-white shadow-[0_0_10px_white]"></div>
</div>
<span class="font-mono-sm text-mono-sm tracking-wider">00:12 / 00:36</span>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined cursor-pointer hover:scale-110 transition-transform">volume_up</span>
<span class="material-symbols-outlined cursor-pointer hover:scale-110 transition-transform">fullscreen</span>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Floating Prompt Bar -->
<div class="fixed bottom-8 left-1/2 md:left-[calc(50%+140px)] -translate-x-1/2 w-full max-w-2xl px-4 z-50">
<div class="bg-surface/90 backdrop-blur-2xl border border-outline-variant/30 rounded-full p-2.5 flex items-center gap-3 shadow-[0_20px_40px_rgba(0,0,0,0.1)]">
<input class="flex-grow bg-transparent border-none focus:ring-0 px-5 font-body-md text-on-surface placeholder:text-on-surface-variant/50" placeholder="Ask to refine the video (e.g. 'make it rainier')..." type="text"/>
<button class="bg-primary text-on-primary w-11 h-11 rounded-full flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">send</span>
</button>
</div>
</div>
</main>
<!-- Interactive Layer -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const videoContainer = document.querySelector('.video-container');
            const playIcon = videoContainer.querySelector('.material-symbols-outlined');
            const bigPlayIcon = videoContainer.querySelector('.absolute.inset-0 .material-symbols-outlined');
            
            videoContainer.addEventListener('click', () => {
                const isPlaying = bigPlayIcon.textContent === 'pause';
                const nextIcon = isPlaying ? 'play_arrow' : 'pause';
                
                bigPlayIcon.textContent = nextIcon;
                
                if(!isPlaying) {
                    videoContainer.querySelector('.absolute.inset-0').style.opacity = '0';
                } else {
                    videoContainer.querySelector('.absolute.inset-0').style.opacity = '1';
                }
            });
        });
    </script>
</body></html>
