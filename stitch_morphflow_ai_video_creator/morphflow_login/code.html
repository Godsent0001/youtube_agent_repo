<body class="min-h-screen flex flex-col font-body-md text-on-surface selection:bg-primary selection:text-on-primary">
<!-- Subtle Background Element -->
<div class="fixed inset-0 ambient-glow pointer-events-none"></div>
<!-- Navigation Shell (Suppressed based on Transactional Rule, but using TopNavBar Brand Anchor logic for Logo) -->
<header class="fixed top-0 left-0 w-full p-container-padding-desktop flex justify-center md:justify-start pointer-events-none">
<div class="pointer-events-auto font-headline-md text-headline-md font-bold text-primary flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">animation</span>
            MorphFlow
        </div>
</header>
<main class="flex-grow flex items-center justify-center p-container-padding-mobile">
<div class="w-full max-w-[420px] z-10">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl p-stack-lg md:p-10 auth-card">
<!-- Header Section -->
<div class="mb-stack-lg text-center md:text-left">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Welcome Back</h1>
<p class="font-body-md text-on-surface-variant">Please enter your details to sign in to your workspace.</p>
</div>
<!-- Form Section -->
<form action="#" class="space-y-stack-md" onsubmit="event.preventDefault();">
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider ml-1" for="email">Email Address</label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 font-body-md focus:ring-1 focus:ring-primary transition-all placeholder:text-outline" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-1">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:opacity-70 transition-opacity" href="#">Forgot Password</a>
</div>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 font-body-md focus:ring-1 focus:ring-primary transition-all placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-primary text-on-primary py-3.5 rounded-lg font-body-lg font-medium hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                            Login
                            <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<!-- Alternative Methods -->
<div class="mt-8">
<div class="relative flex items-center justify-center mb-6">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<span class="relative px-4 bg-surface-container-lowest font-label-md text-on-surface-variant">OR CONTINUE WITH</span>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 border border-outline-variant/30 py-2.5 rounded-lg hover:bg-surface-container transition-colors active:scale-[0.98]">

<span class="font-label-md">Google</span>

</div>
<script>
        // Simple micro-interactions for input focus
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.closest('.space-y-1').querySelector('label').style.color = 'var(--primary)';
            });
            input.addEventListener('blur', () => {
                input.parentElement.closest('.space-y-1').querySelector('label').style.color = '';
            });
        });

        // Atmospheric parallax effect
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.ambient-glow');
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            glow.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(0, 0, 0, 0.015) 0%, rgba(253, 248, 248, 0) 80%)`;
        });
    </script>
