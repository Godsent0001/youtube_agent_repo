<!DOCTYPE html>

<html lang="en"><head>

                      "on-secondary-container": "#626262",

                      "surface-tint": "#5f5e5e",
                      "on-error": "#ffffff",
                      "secondary-container": "#e1dfdf",
                      "secondary-fixed-dim": "#c7c6c6",
                      "on-secondary": "#ffffff",
                      "on-primary-fixed": "#1c1b1b",
                      "on-tertiary": "#ffffff",
                      "on-surface": "#1c1b1b",
                      "inverse-primary": "#c8c6c5",
                      "on-background": "#1c1b1b",
                      "secondary": "#5e5e5e",
                      "primary-fixed": "#e5e2e1",
                      "surface-bright": "#fdf8f8",
                      "primary": "#000000",
                      "surface": "#fdf8f8",
                      "tertiary-container": "#1d1b1a",
                      "on-tertiary-container": "#868381",
                      "on-primary-container": "#858383",
                      "surface-container-low": "#f7f3f2",
                      "on-error-container": "#93000a",
                      "primary-container": "#1c1b1b",
                      "secondary-fixed": "#e4e2e2",
                      "primary-fixed-dim": "#c8c6c5",
                      "on-secondary-fixed": "#1b1c1c",
                      "on-tertiary-fixed-variant": "#484645",
                      "surface-container": "#f1edec",
                      "on-surface-variant": "#444748",
                      "tertiary": "#000000",
                      "outline": "#747878",
                      "surface-dim": "#ddd9d8",
                      "on-primary": "#ffffff",
                      "inverse-on-surface": "#f4f0ef"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-padding-mobile": "20px",
                      "stack-md": "16px",
                      "gutter": "24px",
                      "unit": "4px",
                      "stack-lg": "32px",
                      "section-gap": "64px",
                      "container-padding-desktop": "48px",
                      "stack-sm": "8px"
              },
              "fontFamily": {

                      "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "headline-md": ["20px", {"lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                      "body-lg": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                      "label-md": ["12px", {"lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500"}],

          },

      </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fdf8f8;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="font-body-md text-on-background selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Suppression of Nav Shell as per "Semantic Shell" mandate for Transactional pages -->
<main class="min-h-screen flex items-center justify-center px-container-padding-mobile md:px-container-padding-desktop py-section-gap">
<div class="w-full max-w-[1200px] flex flex-col md:flex-row gap-gutter md:gap-section-gap items-center">
<!-- Left Side: Atmospheric Visual -->
<div class="hidden md:flex flex-1 relative aspect-square max-w-[500px] rounded-xl overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.04)] bg-surface-container border border-outline-variant/30">
<img alt="Atmospheric Visual" class="absolute inset-0 w-full h-auto object-cover opacity-90" data-alt="A sophisticated abstract digital art piece showcasing fluid, morphing shapes in a high-end minimalist setting. The composition uses a monochrome palette of deep charcoal and soft pearl white, creating a sense of calm authority and professional sophistication. Subtle lighting emphasizes the smooth curves and gradients, perfectly reflecting the modern SaaS identity and limitless creative potential of the MorphFlow brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD5rPm5fLKBTWm0ZpZymOGo_xgLHs63ao7Kdn9oLCelKe4xs-GNTcufDvPbflGEnxJzVTze4w7M-5-KAJ8Qhq1XHii1l4vYg_18mURaTSLUgb5PpArZtONzno4HkRswSvGoz_sGnXoxDlonhPFa_HS27OdT-srSAckqC9cTkNGi9GKgkyOWi7Uttli_VKU6U2JlivOh3FJiIfbtzfTCr0UTUc8x2rgaXJphpppzoKIt-hrt8tAbDw3-qk0EqsOvilIWWDCFfkoXVts"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
<div class="absolute bottom-10 left-10 right-10">
<div class="text-white font-headline-md text-headline-md mb-2">Morph Your Reality.</div>
<p class="text-white/80 font-body-md text-body-md">Join the elite community of AI video creators shaping the future of digital motion.</p>
</div>
</div>
<!-- Right Side: Sign Up Form -->
<div class="w-full md:max-w-[440px] flex flex-col">
<header class="mb-stack-lg">
<div class="flex items-center gap-2 mb-stack-md">
<span class="font-headline-md text-headline-md font-black text-primary">MorphFlow</span>
</div>
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">Create Your Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Start building cinematic AI-driven narratives today.</p>
</header>
<form class="space-y-stack-md" onsubmit="event.preventDefault();">
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="full_name">Full Name</label>
<input class="w-full bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-lg px-4 py-3 font-body-md text-body-md transition-all" id="full_name" name="full_name" placeholder="Enter your name" type="text"/>
</div>
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email</label>
<input class="w-full bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-lg px-4 py-3 font-body-md text-body-md transition-all" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-lg px-4 py-3 font-body-md text-body-md transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="confirm_password">Confirm Password</label>
<input class="w-full bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-lg px-4 py-3 font-body-md text-body-md transition-all" id="confirm_password" name="confirm_password" placeholder="••••••••" type="password"/>
</div>
<div class="pt-2">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-lg hover:opacity-90 active:scale-[0.98] transition-all shadow-[0_4px_12px_rgba(0,0,0,0.1)]" type="submit">
                            Create Account
                        </button>
</div>
</form>
<div class="mt-stack-lg flex items-center justify-center gap-2 font-body-md text-body-md">
<span class="text-on-surface-variant">Already have an account?</span>
<a class="text-primary font-bold hover:underline" href="#">Login</a>
</div>
<!-- Subtle Micro-interaction/Atmospheric Decorative Element -->
<div class="mt-section-gap flex items-center gap-4 opacity-30 justify-center grayscale">
<div class="flex items-center gap-1 font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px]" data-icon="lock">lock</span>
<span>Secure AES-256</span>
</div>
<div class="h-1 w-1 bg-on-surface-variant rounded-full"></div>
<div class="flex items-center gap-1 font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px]" data-icon="cloud_done">cloud_done</span>
<span>Multi-Cloud Node</span>
</div>
</div>
</div>
</div>
</main>
<!-- Background Atmospheric Effect -->
<div class="fixed top-0 right-0 -z-10 w-1/3 h-1/2 bg-gradient-to-bl from-primary-fixed/20 to-transparent blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-0 left-0 -z-10 w-1/4 h-1/3 bg-gradient-to-tr from-secondary-fixed/10 to-transparent blur-[100px] pointer-events-none"></div>
<script>
        // Simple micro-interaction for password visibility
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.innerText = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.innerText = 'visibility';
                }
            });
        });

        // Add focus effects to inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });
    </script>
</body></html>
